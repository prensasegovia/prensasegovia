name: Textos completos

# Cada hora baja y limpia el texto completo de las noticias, de pago y abiertas (aquí no hay CORS)
# y lo guarda en public/textos/. La siguiente pasada de «Actualizar noticias» lo publica,
# y el lector lo abre al instante sin pasar por Jina.
on:
  schedule:
    - cron: "33 * * * *"
  workflow_dispatch:
    inputs:
      prueba:
        description: "Solo prueba: enseña una muestra por periódico y no guarda nada"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: textos
  cancel-in-progress: false

jobs:
  textos:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Descargar y limpiar los textos
        run: node scripts/textos.mjs
        env:
          MUESTRA: ${{ inputs.prueba && '1' || '' }}

      - name: Guardar en el repositorio
        if: ${{ !inputs.prueba }}
        run: |
          git config user.name "prensa-bot"
          git config user.email "prensa-bot@users.noreply.github.com"
          git add -A public/textos/ datos/textos.json
          git diff --cached --quiet && exit 0
          git commit -m "Textos completos $(date -u +'%Y-%m-%d %H:%M') UTC"
          for i in 1 2 3; do git push && break; git pull --rebase -X theirs -q; sleep 3; done
