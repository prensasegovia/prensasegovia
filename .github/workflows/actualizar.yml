name: Actualizar noticias

on:
  schedule:
    # Cada hora (minuto 17 para evitar la congestión de las horas en punto)
    - cron: "17 * * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths-ignore: ["public/datos.json", "diag/**", "scripts/descubrir.mjs", ".github/workflows/diagnostico.yml"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: actualizar
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Recopilar noticias
        run: node scripts/actualizar.mjs

      - name: Guardar datos en el repositorio
        run: |
          git config user.name "prensa-bot"
          git config user.email "prensa-bot@users.noreply.github.com"
          git add public/datos.json
          git diff --cached --quiet || git commit -m "Noticias actualizadas $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - id: deploy
        uses: actions/deploy-pages@v4
