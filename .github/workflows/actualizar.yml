name: Actualizar noticias

on:
  schedule:
    # Respaldo cada 20 min (el despertador de Apps Script es el que manda)
    - cron: "7,27,47 * * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths-ignore: ["public/datos.json", "public/periodicos.json", "public/archivo/**", "public/hemeroteca/**", "datos/**", "diag/**", "scripts/descubrir.mjs", ".github/workflows/diagnostico.yml"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: actualizar
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Recopilar noticias
        run: node scripts/actualizar.mjs

      - name: Avisos al móvil
        run: node scripts/avisos.mjs
        continue-on-error: true
        env:
          AVISOS: ${{ secrets.AVISOS }}

      - name: Guardar datos en el repositorio
        run: |
          git config user.name "prensa-bot"
          git config user.email "prensa-bot@users.noreply.github.com"
          git add public/datos.json public/periodicos.json public/archivo/ public/hemeroteca/ datos/
          git diff --cached --quiet || git commit -m "Noticias actualizadas $(date -u +'%Y-%m-%d %H:%M') UTC"
          for i in 1 2 3; do git push && break; git pull --rebase -X theirs -q; sleep 3; done

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - id: deploy
        uses: actions/deploy-pages@v4
        continue-on-error: true
        with:
          timeout: 300000

      # GitHub Pages a veces falla de forma pasajera: se reintenta una vez
      - if: steps.deploy.outcome == 'failure'
        run: sleep 45

      # Si GitHub Pages sigue atascado, no se marca como fallo (no llega correo):
      # las noticias ya están guardadas y la siguiente pasada las publica.
      - if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true
        with:
          timeout: 300000
